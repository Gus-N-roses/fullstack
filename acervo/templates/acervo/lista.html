<h1>Acervo</h1>

<form method="get">
    <input type="text" name="nome" placeholder="Buscar por título" value="{{ request.GET.nome }}">

    <select name="tipo">
        <option value="">Todos os tipos</option>
        {% for valor, rotulo in tipos %}
        <option value="{{ valor }}" {% if request.GET.tipo == valor %}selected{% endif %}>{{ rotulo }}</option>
        {% endfor %}
    </select>

    <select name="categoria">
        <option value="">Todas as categorias</option>
        {% for valor, rotulo in categorias %}
        <option value="{{ valor }}" {% if request.GET.categoria == valor %}selected{% endif %}>{{ rotulo }}</option>
        {% endfor %}
    </select>

    <button type="submit">Buscar</button>
</form>

<ul>
{% for livro in livros %}
    <li>{{ livro.titulo }} — {{ livro.autor }} ({{ livro.get_tipo_acervo_display }}, {{ livro.get_categoria_display }})</li>
{% empty %}
    <li>Nenhum livro encontrado.</li>
{% endfor %}
</ul>
